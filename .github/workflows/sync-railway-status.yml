name: Sync Railway Status

on:
  workflow_call:
    inputs:
      sha:
        description: Full commit SHA whose CI-approved deployment is being tracked
        required: true
        type: string
      state:
        description: GitHub commit status state
        required: true
        type: string
      description:
        description: One-line GitHub commit status description
        required: true
        type: string
      target_url:
        description: Calling Railway deployment workflow URL
        required: true
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    name: Publish Railway commit status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted deployment policy
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-source
          persist-credentials: false

      - name: Setup pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: workflow-source/.node-version

      - name: Validate commit status input
        env:
          COMMIT_SHA: ${{ inputs.sha }}
          COMMIT_STATE: ${{ inputs.state }}
          COMMIT_DESCRIPTION: ${{ inputs.description }}
          COMMIT_TARGET_URL: ${{ inputs.target_url }}
        run: node workflow-source/scripts/railway-deployment-policy.mjs validate-commit-status

      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ inputs.sha }}
          COMMIT_STATE: ${{ inputs.state }}
          COMMIT_DESCRIPTION: ${{ inputs.description }}
          COMMIT_TARGET_URL: ${{ inputs.target_url }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --method POST \
            --field state="$COMMIT_STATE" \
            --field context='hyperia - hyperia' \
            --field description="$COMMIT_DESCRIPTION" \
            --field target_url="$COMMIT_TARGET_URL" \
            >/dev/null
