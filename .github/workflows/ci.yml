name: CI

on:
  push:
    branches: [main, staging, develop, dev, hackathon]
  pull_request:
    branches: [main, staging, develop, dev, hackathon]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            bun install --frozen-lockfile && break
            echo "Attempt $i failed, retrying in $((i * 15))s..."
            sleep $((i * 15))
          done

      - name: Verify pinned ElizaOS runtime graph
        run: |
          bun run eliza:runtime-pins
          bun run eliza:runtime-pins:test
          bun run eliza:runtime-smoke

      - name: Run ESLint
        run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hyperia
          POSTGRES_PASSWORD: hyperia_test
          POSTGRES_DB: hyperia_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            ffmpeg

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            bun install --frozen-lockfile && break
            echo "Attempt $i failed, retrying in $((i * 15))s..."
            sleep $((i * 15))
          done

      - name: Build packages in dependency order
        run: |
          cd packages/physx-js-webidl && bun run build
          cd ../shared && bun run build
          cd ../decimation && bun run build
          cd ../impostors && bun run build
          cd ../procgen && bun run build
          cd ../plugin-hyperia && bun run build
          cd ../server && bun run build

      - name: Verify launch-world navigation gates
        run: |
          bun run assets:verify:duel-arena-layout
          bun run assets:verify:preparation-topology
          bun run assets:verify:town-collision

      - name: Verify stream media runtime and startup failures
        run: |
          bun run stream:runtime:test
          bun run physics:runtime:test

      - name: Verify browser stream resource accounting
        run: |
          bunx --no-install playwright install --with-deps chromium
          bun run stream:browser-performance:test

      - name: Verify duel equipment authority policy
        run: |
          bun run equipment:active-combat-orientation:test
          bun run equipment:active-combat-orientation:check
          bun run equipment:fit:test
          bun run duel:smoke:policy:test

      - name: Setup database schema
        working-directory: packages/server
        run: bunx drizzle-kit push
        env:
          DATABASE_URL: postgresql://hyperia:hyperia_test@localhost:5432/hyperia_test

      - name: Run tests
        run: bunx turbo run test --filter='!@hyperforge/app' --filter='!@hyperforge/contracts' --filter='!@playhyperia/duel-oracle-evm' --filter='!@hyperforge/impostor'
        env:
          DATABASE_URL: postgresql://hyperia:hyperia_test@localhost:5432/hyperia_test
          NODE_ENV: test
          PUBLIC_CDN_URL: https://assets.hyperia.club

      - name: Verify retained competitive tactical ablation
        working-directory: packages/server
        run: bun run fixtures:tactical-ablation:check

      - name: Verify gathering reward process-kill custody
        working-directory: packages/server
        run: bun run test:gathering-reward-chaos

      - name: Verify processing action process-kill custody
        working-directory: packages/server
        run: bun run test:processing-action-chaos

      - name: Verify external ElizaOS preparation process-kill fencing
        working-directory: packages/server
        run: bun run test:external-duel-preparation-host-lease-built-chaos

      - name: Verify production agent WebSocket authentication, reconnect, and on-deck host loss
        working-directory: packages/server
        run: bun run test:agent-websocket-auth-built

      - name: Verify fired projectile process and database crash custody
        working-directory: packages/server
        run: bun run test:projectile-cost-host-loss-chaos

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            bun install --frozen-lockfile && break
            echo "Attempt $i failed, retrying in $((i * 15))s..."
            sleep $((i * 15))
          done

      - name: Build all packages with Turbo
        run: bunx turbo run build --filter=!@hyperforge/app

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            packages/shared/dist
            packages/shared/build
            packages/server/dist
            packages/client/dist
            packages/client/build
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/hackathon')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_tag=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "env_tag=staging" >> $GITHUB_OUTPUT
          else
            echo "env_tag=development" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.server
          push: false
          tags: |
            hyperia-server:${{ github.sha }}
            hyperia-server:${{ steps.env.outputs.env_tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
