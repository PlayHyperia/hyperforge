[extend]
useDefault = true

# This public protocol discriminator names an authentication method. It is not
# a wallet signature, API key, credential, session token or private key.
# Match the complete field expression; do not ignore auth files or test folders.
[[allowlists]]
description = "Public versioned Solana authentication-method discriminator"
regexTarget = "match"
regexes = ['''^authMethod:\s*"sol-wallet-signature-v1"$''']

# Public terrain-worker fixture label, not a credential. Keep the exact complete
# expression so unrelated keys in this test and all other files remain scanned.
[[allowlists]]
description = "Public sculpt-v2 bay terrain chunk fixture label"
regexTarget = "match"
regexes = ['''^chunkKey:\s*"sculpt-v2-bay"$''']
